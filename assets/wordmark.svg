<!-- The hycu wordmark, drawn as outlines: Gloock Regular (Duarte Pinto, SIL OFL 1.1 — free for
     commercial and logo use), in the ink colour of the Limestone & Cypress palette (#1a1e18).
     Wyatt chose Gloock on 2026-09-12 over Arsenica and over the measurement's own top three: it is
     the only true high-contrast didone among the closest shapes, which is the quality that made
     Arsenica worth copying. Not live text, so no page loads a font for the wordmark. The ink is
     BAKED IN, because an img element does not inherit currentColor: if the ink token changes, this
     file has to be redrawn from the source font. No double hyphens in here, ever — XML forbids
     them inside a comment, and a malformed comment silently breaks the whole image. -->
